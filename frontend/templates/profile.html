
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | Smart Census System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="card shadow-sm mx-auto" style="max-width: 600px;">
            <div class="card-body p-4">
                <h2 class="mb-4">My Profile</h2>

                <p><strong>Name:</strong> {{ user["name"] or "Not provided" }}</p>
                <p><strong>Email:</strong> {{ user["email"] }}</p>
                <p><strong>Member since:</strong> {{ user["created_at"] or "Not available" }}</p>

                <a href="{{ url_for('dashboard') }}" class="btn btn-primary mt-3">
                    Back to Dashboard
                </a>

                <a href="{{ url_for('logout') }}" class="btn btn-outline-secondary mt-3">
                    Logout
                </a>
            </div>
        </div>
    </div>
</body>
</html>
