<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Forgot Password | Smart Census</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #eef4ff,
                    #f8fbff
                );

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 430px;
            max-width: 92%;

            background: white;

            border-radius: 22px;

            padding: 42px;

            box-shadow:
                0 20px 60px
                rgba(20, 40, 80, 0.12);
        }

        .logo {
            width: 58px;
            height: 58px;

            border-radius: 16px;

            background:
                linear-gradient(
                    135deg,
                    #1d4ed8,
                    #2563eb
                );

            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 22px;
            font-weight: 800;

            margin-bottom: 24px;
        }

        h1 {
            margin: 0 0 10px;

            color: #172033;

            font-size: 28px;
        }

        .subtitle {
            margin: 0 0 30px;

            color: #687386;

            line-height: 1.6;

            font-size: 14px;
        }

        label {
            display: block;

            margin-bottom: 8px;

            font-size: 14px;

            font-weight: 600;

            color: #344054;
        }

        input {
            width: 100%;

            padding: 14px 15px;

            border: 1px solid #d9e0ea;

            border-radius: 12px;

            font-size: 15px;

            outline: none;

            transition: 0.2s;
        }

        input:focus {
            border-color: #2563eb;

            box-shadow:
                0 0 0 4px
                rgba(37, 99, 235, 0.10);
        }

        .button {
            width: 100%;

            border: none;

            margin-top: 22px;

            padding: 14px;

            border-radius: 12px;

            background: #2563eb;

            color: white;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;
        }

        .button:hover {
            background: #1d4ed8;
        }

        .back {
            display: block;

            text-align: center;

            margin-top: 22px;

            color: #2563eb;

            text-decoration: none;

            font-size: 14px;

            font-weight: 600;
        }

        .message {
            padding: 12px 14px;

            border-radius: 10px;

            margin-bottom: 20px;

            font-size: 14px;
        }

        .error {
            background: #fff1f2;

            color: #be123c;
        }

        .success {
            background: #ecfdf3;

            color: #047857;
        }

    </style>

</head>

<body>

    <div class="container">

        <div class="logo">
            SC
        </div>

        <h1>Forgot Password?</h1>

        <p class="subtitle">
            Enter the email address registered with
            your Smart Census account.
        </p>

        {% with messages = get_flashed_messages(with_categories=true) %}

            {% if messages %}

                {% for category, message in messages %}

                    <div class="message {{ category }}">
                        {{ message }}
                    </div>

                {% endfor %}

            {% endif %}

        {% endwith %}

        <form method="POST">

            <label for="email">
                Registered Email
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your registered email"
                required
                autocomplete="email"
            >

            <button
                type="submit"
                class="button"
            >
                Continue
            </button>

        </form>

        <a
            href="{{ url_for('login') }}"
            class="back"
        >
            ← Back to Login
        </a>

    </div>

</body>

</html>
