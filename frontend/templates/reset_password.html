<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Reset Password | Smart Census</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #eef4ff,
                    #f8fbff
                );

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 430px;
            max-width: 92%;

            background: white;

            border-radius: 22px;

            padding: 42px;

            box-shadow:
                0 20px 60px
                rgba(20, 40, 80, 0.12);
        }

        .logo {
            width: 58px;
            height: 58px;

            border-radius: 16px;

            background:
                linear-gradient(
                    135deg,
                    #1d4ed8,
                    #2563eb
                );

            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 22px;
            font-weight: 800;

            margin-bottom: 24px;
        }

        h1 {
            margin: 0 0 10px;

            color: #172033;

            font-size: 28px;
        }

        .subtitle {
            margin: 0 0 30px;

            color: #687386;

            line-height: 1.6;

            font-size: 14px;
        }

        label {
            display: block;

            margin-bottom: 8px;

            font-size: 14px;

            font-weight: 600;

            color: #344054;
        }

        .password-box {
            position: relative;

            margin-bottom: 18px;
        }

        input {
            width: 100%;

            padding: 14px 65px 14px 15px;

            border: 1px solid #d9e0ea;

            border-radius: 12px;

            font-size: 15px;

            outline: none;

            transition: 0.2s;
        }

        input:focus {
            border-color: #2563eb;

            box-shadow:
                0 0 0 4px
                rgba(37, 99, 235, 0.10);
        }

        .show-button {
            position: absolute;

            right: 12px;
            top: 50%;

            transform: translateY(-50%);

            border: none;

            background: transparent;

            color: #2563eb;

            font-size: 13px;

            font-weight: 700;

            cursor: pointer;
        }

        .button {
            width: 100%;

            border: none;

            margin-top: 8px;

            padding: 14px;

            border-radius: 12px;

            background: #2563eb;

            color: white;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;
        }

        .button:hover {
            background: #1d4ed8;
        }

        .back {
            display: block;

            text-align: center;

            margin-top: 22px;

            color: #2563eb;

            text-decoration: none;

            font-size: 14px;

            font-weight: 600;
        }

        .message {
            padding: 12px 14px;

            border-radius: 10px;

            margin-bottom: 20px;

            font-size: 14px;
        }

        .error {
            background: #fff1f2;

            color: #be123c;
        }

        .success {
            background: #ecfdf3;

            color: #047857;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="logo">
        SC
    </div>

    <h1>Reset Password</h1>

    <p class="subtitle">
        Enter your new password below.
    </p>

    {% with messages = get_flashed_messages(with_categories=true) %}

        {% if messages %}

            {% for category, message in messages %}

                <div class="message {{ category }}">
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}

    {% endwith %}

    <form
        method="POST"
        action="{{ url_for('reset_password') }}"
        onsubmit="return validatePasswords();"
    >

        <label for="new_password">
            New Password
        </label>

        <div class="password-box">

            <input
                type="password"
                id="new_password"
                name="new_password"
                placeholder="Enter new password"
                required
                autocomplete="new-password"
            >

            <button
                type="button"
                class="show-button"
                onclick="togglePassword(
                    'new_password',
                    this
                )"
            >
                Show
            </button>

        </div>

        <label for="confirm_password">
            Confirm Password
        </label>

        <div class="password-box">

            <input
                type="password"
                id="confirm_password"
                name="confirm_password"
                placeholder="Re-enter new password"
                required
                autocomplete="new-password"
            >

            <button
                type="button"
                class="show-button"
                onclick="togglePassword(
                    'confirm_password',
                    this
                )"
            >
                Show
            </button>

        </div>

        <button
            type="submit"
            class="button"
        >
            Update Password
        </button>

    </form>

    <a
        href="{{ url_for('login') }}"
        class="back"
    >
        ← Back to Login
    </a>

</div>

<script>

function togglePassword(inputId, button) {

    const input =
        document.getElementById(inputId);

    if (input.type === "password") {

        input.type = "text";

        button.textContent = "Hide";

    } else {

        input.type = "password";

        button.textContent = "Show";

    }
}


function validatePasswords() {

    const newPassword =
        document.getElementById(
            "new_password"
        ).value;

    const confirmPassword =
        document.getElementById(
            "confirm_password"
        ).value;


    if (newPassword !== confirmPassword) {

        alert(
            "Passwords do not match."
        );

        return false;
    }

    return true;
}

</script>

</body>

</html>
